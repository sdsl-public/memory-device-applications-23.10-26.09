<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Provisional Literature Census</title>
  <style>
    :root { color-scheme: light; --ink:#202124; --muted:#6e7378; --line:#e4e6e8; --link:#275f9b; --active:#202124; }
    * { box-sizing:border-box }
    body { margin:0; background:#fff; color:var(--ink); font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    main { max-width:1180px; margin:0 auto; padding:22px 28px 50px }
    h1 { margin:0 0 2px; font-size:22px; font-weight:650; letter-spacing:-.02em }
    .status { color:var(--muted); font-size:12px }
    .coverage-note { margin:4px 0 15px; color:var(--muted); font-size:11px }
    .controls { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 0 7px }
    .control-row { display:flex; align-items:flex-start; gap:8px; margin:5px 0 }
    .label { flex:0 0 78px; padding-top:3px; color:var(--muted); font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em }
    .options { display:flex; flex-wrap:wrap; gap:3px 5px }
    button { appearance:none; border:1px solid #cfd3d7; border-radius:3px; background:#fff; color:#45494d; padding:2px 7px; font:inherit; font-size:11px; cursor:pointer }
    button:hover { border-color:#92979c }
    button.active { border-color:var(--active); background:var(--active); color:#fff }
    button:disabled { cursor:default; opacity:.5 }
    .toolbar { display:flex; align-items:center; gap:10px; padding:10px 0 7px }
    input[type=search] { width:min(370px,55vw); border:1px solid #c7cbd0; border-radius:3px; padding:5px 8px; font:inherit }
    #count { font-weight:650 }
    #rendered { color:var(--muted); font-size:11px }
    #reset { margin-left:auto }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid var(--link); outline-offset:2px }
    .toolbar { flex-wrap:wrap }
    .loading { font-variant-numeric:tabular-nums }
    .paper { padding:6px 0 5px; border-top:1px solid var(--line); min-width:0 }
    .title-line,.meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .number { display:inline-block; width:58px; color:#8a8e92; font-variant-numeric:tabular-nums }
    .title-line a { color:var(--link); text-decoration:none; font-weight:520 }
    .title-line a:hover { text-decoration:none; opacity:.8 }
    .title-line sub,.title-line sup { font-size:.75em; line-height:0 }
    .meta { padding-left:58px; color:var(--muted); font-size:11.5px }
    .tag { color:#58616a }
    #sentinel { height:1px }
    .loading,.empty { padding:20px 0; color:var(--muted) }
    @media (max-width:700px) { main{padding:15px 14px}.control-row{display:block}.label{margin-bottom:3px}.number{width:52px}.meta{padding-left:52px} }
  </style>
</head>
<body><main>
  <header>
    <h1>Literature Census</h1>
    <div class="status"><strong>PROVISIONAL · 2023-10-01–2026-09-24</strong> · <span id="coverage">loading inventory…</span></div>
    <div class="coverage-note">Publication metadata and links only. Candidates are provisionally screened; article PDFs, full texts, and abstracts are not hosted.</div>
  </header>
  <section class="controls" aria-label="Publication filters">
    <div class="control-row"><div class="label">Scope</div><div class="options" id="scope"></div></div>
    <div class="control-row"><div class="label">Venue</div><div class="options" id="venue"></div></div>
    <div class="control-row"><div class="label">Year</div><div class="options" id="year"></div></div>
    <div class="control-row"><div class="label">Technology</div><div class="options" id="technology"></div></div>
    <div class="control-row"><div class="label">Topic</div><div class="options" id="topic"></div></div>
  </section>
  <div class="toolbar">
    <input disabled id="search" type="search" placeholder="Search title, authors, DOI, or venue" aria-label="Search publications">
    <span id="count">Loading…</span><span id="rendered"></span><button id="reset" disabled>Reset</button>
  </div>
  <noscript><p class="empty">Enable JavaScript to browse and filter the publication inventory.</p></noscript>
  <div id="results" aria-live="polite"><div class="loading">Loading publication index…</div></div>
  <div id="sentinel"></div>
</main>
<script src="./app.js?v=8498b4069c37821a" defer></script></body></html>
